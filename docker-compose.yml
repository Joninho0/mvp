version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: bank_postgres
    environment:
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_secret
      POSTGRES_DB: bank_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_user -d bank_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bank_network

  redis:
    image: redis:7-alpine
    container_name: bank_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bank_network

  postgres_test:
    image: postgres:15-alpine
    container_name: bank_postgres_test
    environment:
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_secret
      POSTGRES_DB: bank_db_test
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - bank_network

volumes:
  postgres_data:
  redis_data:
  postgres_test_data:

networks:
  bank_network:
    driver: bridge