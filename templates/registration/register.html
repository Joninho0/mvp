{% extends "base.html" %}

{% block title %}Cadastro - Bank MVP{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <div class="text-center mb-8">
            <i class="fas fa-user-plus text-5xl text-blue-600 mb-4"></i>
            <h1 class="text-2xl font-bold text-gray-800">Criar Conta</h1>
            <p class="text-gray-600">Abra sua conta no Bank MVP</p>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            {% if form.errors %}
            <div class="bg-red-100 text-red-800 p-4 rounded">
                {% for error in form.errors.values %}
                <p>{{ error }}</p>
                {% endfor %}
            </div>
            {% endif %}

            <div>
                <label for="id_email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" name="email" id="id_email" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
                    placeholder="seu@email.com">
            </div>

            <div>
                <label for="id_first_name" class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
                <input type="text" name="first_name" id="id_first_name" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
                    placeholder="Seu nome">
            </div>

            <div>
                <label for="id_last_name" class="block text-sm font-medium text-gray-700 mb-1">Sobrenome</label>
                <input type="text" name="last_name" id="id_last_name" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
                    placeholder="Seu sobrenome">
            </div>

            <div>
                <label for="id_cpf" class="block text-sm font-medium text-gray-700 mb-1">CPF</label>
                <input type="text" name="cpf" id="id_cpf" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
                    placeholder="000.000.000-00">
            </div>

            <div>
                <label for="id_password1" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                <input type="password" name="password1" id="id_password1" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
                    placeholder="Minimo 12 caracteres">
            </div>

            <div>
                <label for="id_password2" class="block text-sm font-medium text-gray-700 mb-1">Confirmar Senha</label>
                <input type="password" name="password2" id="id_password2" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
                    placeholder="Digite a senha novamente">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                <i class="fas fa-user-plus mr-2"></i>Cadastrar
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-600">Ja tem conta?
                <a href="{% url 'login' %}" class="text-blue-600 hover:underline">Faca login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
